<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Game Đầu Tiên - Học Làm Pong</title>
    <style>
        /* Trang trí một chút cho giống màn hình máy chơi game */
        body {
            background-color: #2c3e50;
            /* Màu nền tối ngoài web */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        canvas {
            background-color: #000000;
            /* Sân chơi màu đen */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #ecf0f1;
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // ==========================================
        // PHẦN 1: THIẾT LẬP MÔI TRƯỜNG VÀ DỮ LIỆU
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d"); // ctx là "cây cọ" để vẽ hình lên canvas

        // Thông số của quả bóng
        const ball = {
            x: 400,         // Vị trí nằm ở giữa màn hình (800 / 2)
            y: 300,         // Vị trí nằm ở giữa màn hình (600 / 2)
            radius: 10,     // Bán kính quả bóng
            speedX: 5,      // Tốc độ bay theo chiều ngang
            speedY: 5       // Tốc độ bay theo chiều dọc
        };

        // Thông số thanh chắn của người chơi (bên trái)
        const player = {
            x: 20,
            y: 250,
            width: 15,
            height: 100,
            speed: 8
        };

        // ==========================================
        // PHẦN 2: XỬ LÝ LOGIC (Bộ Não Của Game)
        // ==========================================
        function update() {
            // Nơi này chạy 60 lần 1 giây. Bạn sẽ làm toán ở đây!

            // 👉 THỬ THÁCH 1 CHO BẠN: Bỏ comment 2 dòng dưới đây, lưu file và F5 trình duyệt xem bóng bay đi đâu?
            ball.x = ball.x + ball.speedX;
            ball.y = ball.y + ball.speedY;

            // 👉 THỬ THÁCH 2: Quả bóng bay mất tiêu rồi! Hãy viết lệnh IF ở đây để:
            // "NẾU ball.y chạm ranh giới dưới (600) HOẶC chạm ranh giới trên (0), 
            // THÌ đổi dấu ball.speedY thành số âm để bóng nảy ngược lại."
            if((ball.y + ball.radius)  >= canvas.height || (ball.y - ball.radius) <= 0){
                ball.speedY = -ball.speedY;
            }
            if((ball.x + ball.radius) >= canvas.width || (ball.x - ball.radius) <= 0){
                ball.speedX = -ball.speedX;
            }

            // 👉 THỬ THÁCH 3: Thanh chắn của bạn vẫn đứng yên, hãy viết lệnh IF ở đây để:
            // "NẾU người chơi nhấn phím W, THÌ giảm player.y
            //  NẾU người chơi nhấn phím S, THÌ tăng player.y"
            document.addEventListener("keydown", function(event){
                if(event.key === "w" || event.key === "W" || event.key === "Ư" || event.key === "ư"){
                    player.y -= player.speed;
                } else if(event.key === "s" || event.key === "S" || event.key === "S" || event.key === "s") {
                    player.y += player.speed;
                }
            });

        }

        // ==========================================
        // PHẦN 3: VẼ LÊN MÀN HÌNH (Đôi Mắt Của Game)
        // ==========================================
        function draw() {
            // BƯỚC QUAN TRỌNG: Xóa toàn bộ màn hình cũ trước khi vẽ khung hình mới
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ thanh chắn của người chơi (Màu trắng)
            ctx.fillStyle = "white";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Vẽ quả bóng (Màu đỏ)
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // ==========================================
        // PHẦN 4: VÒNG LẶP GAME (Trái Tim Của Game)
        // ==========================================
        function gameLoop() {
            update(); // 1. Tính toán lại vị trí
            draw();   // 2. Vẽ lại màn hình với vị trí mới

            // 3. Yêu cầu trình duyệt gọi lại vòng lặp này liên tục để tạo ảnh động
            requestAnimationFrame(gameLoop);
        }

        // KHỞI ĐỘNG NHỊP TIM ĐẦU TIÊN
        gameLoop();
    </script>

</body>

</html>
